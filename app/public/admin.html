<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b0e14">
    <title>Host</title>
    <link rel="stylesheet" href="/admin.css">
</head>

<body>
    <header class="header">
        <div>
            <h1>Host</h1>
            <p class="subtitle">Mappings, teams, and whether the game is receiving inputs</p>
        </div>
        <p class="status" id="status" data-state="connecting">Connecting</p>
    </header>

    <section class="panel controls">
        <button type="button" id="sendingBtn" data-state="on">Inputs on</button>
        <button type="button" id="resetTeamsBtn">Reset teams</button>
    </section>

    <section class="panel admin-key" id="adminKeyPanel" hidden>
        <label for="adminKey">Admin key</label>
        <input type="password" id="adminKey" autocomplete="off" placeholder="Required to save changes">
    </section>

    <section class="panel presets">
        <h2>Saved mappings</h2>
        <div class="preset-row">
            <input id="presetName" type="text" maxlength="48" placeholder="Name, e.g. celeste" autocomplete="off">
            <button type="button" id="savePresetBtn">Save</button>
        </div>
        <div class="preset-row">
            <select id="presetList">
                <option value="">No saved mappings</option>
            </select>
            <button type="button" id="loadPresetBtn">Load</button>
            <button type="button" id="deletePresetBtn">Delete</button>
        </div>
        <div class="preset-row">
            <button type="button" id="downloadPresetBtn">Download</button>
            <button type="button" id="uploadPresetBtn">Load from file</button>
            <input id="uploadPresetFile" type="file" accept="application/json,.json" hidden>
        </div>
    </section>

    <div id="teamPanels"></div>

    <p class="message" id="message" role="status"></p>

    <script type="module" src="/admin.js"></script>
</body>

</html>
