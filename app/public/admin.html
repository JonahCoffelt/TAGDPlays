<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b0e14">
    <title>Host</title>
    <link rel="stylesheet" href="/admin.css">
</head>

<body>
    <header class="header">
        <div>
            <h1>Host</h1>
            <p class="subtitle">Mappings, teams, and whether the game is receiving inputs</p>
        </div>
        <p class="status" id="status" data-state="connecting">Connecting</p>
    </header>

    <section class="panel controls">
        <button type="button" id="sendingBtn" data-state="on">Inputs on</button>
        <button type="button" id="resetTeamsBtn">Reset teams</button>
    </section>

    <section class="panel admin-key" id="adminKeyPanel" hidden>
        <label for="adminKey">Admin key</label>
        <input type="password" id="adminKey" autocomplete="off" placeholder="Required to save changes">
    </section>

    <div id="teamPanels"></div>

    <p class="message" id="message" role="status"></p>

    <script type="module" src="/admin.js"></script>
</body>

</html>
