<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0b0e14">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Controller</title>
    <link rel="stylesheet" href="/styles.css">
</head>

<body>
    <span class="status" id="status" data-state="connecting" role="status">Connecting</span>

    <section class="picker" id="picker" hidden>
        <h1 class="picker-title">Pick your team</h1>
        <p class="picker-hint">You will stay on this team for the rest of the event</p>
        <div class="picker-teams" id="pickerTeams"></div>
    </section>

    <main class="controller" id="controller" hidden>
        <div class="badge" id="badge">
            <img class="badge-image" id="badgeImage" alt="">
            <span class="badge-name" id="badgeName"></span>
        </div>

        <div class="dpad">
            <button class="dpad-key dpad-up" type="button" data-input="up" aria-label="Up"></button>
            <button class="dpad-key dpad-left" type="button" data-input="left" aria-label="Left"></button>
            <span class="dpad-hub" aria-hidden="true"></span>
            <button class="dpad-key dpad-right" type="button" data-input="right" aria-label="Right"></button>
            <button class="dpad-key dpad-down" type="button" data-input="down" aria-label="Down"></button>
        </div>

        <div class="face">
            <button class="face-key face-y" type="button" data-input="Y">Y</button>
            <button class="face-key face-x" type="button" data-input="X">X</button>
            <button class="face-key face-b" type="button" data-input="B">B</button>
            <button class="face-key face-a" type="button" data-input="A">A</button>
        </div>
    </main>

    <script type="module" src="/client.js"></script>
</body>

</html>
